<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>GitLab MR Previewer</title>
	<style>
		:root {
			--primary-color: #7759c2; /* Morado GitLab */
			--accent-color: #e24329;  /* Naranja GitLab */
			--bg-color: #ffffff;
			--text-color: #333238;
			--border-color: #dbdbdb;
			--font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		}

		body {
			font-family: var(--font-family);
			width: 280px;
			margin: 0;
			padding: 16px;
			background-color: var(--bg-color);
			color: var(--text-color);
		}

		header {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 16px;

			h2 {
				font-size: 16px;
				margin: 0;
				color: var(--text-color);
			}
		}

		form {
			margin-bottom: 12px;
			display: flex;
			flex-direction: column;
			gap: 8px;

			label {
				display: flex;
				flex-direction: column;
				gap: 4px;
				font-size: 12px;
				font-weight: 600;
				color: #666;

				.required {
					color: red;
				}

				.optional {
					font-size: 11px;
					color: #888;
				}
			}

			input {
				width: 100%;
				box-sizing: border-box;
				padding: 8px 10px;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				font-size: 13px;
				transition: border-color 0.2s;
			}

			input:focus {
				outline: none;
				border-color: var(--primary-color);
				box-shadow: 0 0 0 2px rgba(119, 89, 194, 0.2);
			}

			button {
				width: 100%;
				padding: 10px;
				background-color: var(--primary-color);
				color: white;
				border: none;
				border-radius: 4px;
				font-weight: 600;
				cursor: pointer;
				transition: background-color 0.2s;

				&:hover {
					background-color: #5941a9;
				}

				&:active {
					transform: translateY(1px);
				}
			}

			#status {
				height: 14px;
				font-size: 11px;
				margin: 0;
				text-align: center;
				font-weight: 500;
			}
		}

		pre {
			margin: 4px 0;
		}

		footer {
			margin-top: 8px;
			padding-top: 12px;
			border-top: 1px solid #eee;
			text-align: center;
			font-size: 11px;
			color: #999;

			a {
				text-decoration: none;
				color: var(--accent-color);
			}
		}
	</style>
</head>
<body>

<header>
	<img src="icons/icon.svg" width="24" height="24" alt="GitLab MR Previewer" />
	<h2>GitLab MR Previewer</h2>
</header>

<form id="form" class="form-group">
	<label>
		<span>Personal Access Token <span class="required">*</span></span>
		<input id="token" name="token" type="password" />
		<small>
			Used for getting MR's info. You can get one going to:
			<pre style="white-space: normal">GitLab > Preferences > Personal Access Tokens > Add new token > Select just "read api" scope</pre>
		</small>
	</label>

	<button type="submit">Save</button>
	<p id="status"></p>

	<label>
		<span>GitLab domain <span class="optional">(optional)</span></span>
		<input id="domain" name="domain" type="url" placeholder="https://gitlab.xxxxxx.xxx" />
		<small>Only used for getting the avatars, nothing else.</small>
	</label>
</form>

<footer>
	Made with 💚 by <a href="https://github.com/dmoyadev" target="_blank"><strong>Daniel Moya</strong></a>
	<br>
	<small>less <i>"thanks"</i> and <i>"sorry"</i>, more <i>"take this 5€ Bizum"</i></small>
</footer>

<script src="popup.js"></script>
</body>
</html>
